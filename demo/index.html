<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report Studio – offline designer demo</title>
<link rel="stylesheet" href="../static/rpt-designer.css">
<style>
  html,body{margin:0;height:100%;background:#dfe4ea;font:13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .bar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#1f2a37;color:#e6ebf2}
  .bar b{font-size:14px;color:#fff}.bar select,.bar button{font:inherit;padding:4px 8px;border-radius:5px;border:1px solid #445166;background:#2b3748;color:#fff}
  .bar .note{opacity:.7;margin-left:auto}
  #rpt-designer{height:calc(100vh - 46px);border-radius:0;border:0}
</style>
</head>
<body>
<div class="bar">
  <b>Report Studio</b><span>offline demo</span>
  <select id="pick"></select>
  <button type="button" id="reset" title="Discard demo changes stored in this browser">Reset demo</button>
  <span class="note">Data comes from a local mock – in APEX the same designer talks to RPT_AJAX.</span>
</div>
<div id="rpt-designer"></div>
<script src="../static/rpt-engine.js"></script>
<script src="../static/rpt-designer.js"></script>
<script src="../samples/samples.js"></script>
<script src="rpt-mock.js"></script>
<script>
  (function () {
    var pick = document.getElementById('pick');
    var params = new URLSearchParams(location.search);
    var id = params.has('id') ? params.get('id') : '1';
    RptMock.list().forEach(function (r) {
      pick.insertAdjacentHTML('beforeend', '<option value="' + r.id + '"' + (String(r.id) === id ? ' selected' : '') + '>' + r.code + ' – ' + r.name + '</option>');
    });
    pick.insertAdjacentHTML('beforeend', '<option value=""' + (id === '' ? ' selected' : '') + '>+ New report</option>');
    pick.onchange = function () { location.search = '?id=' + pick.value; };
    document.getElementById('reset').onclick = function () { if (confirm('Reset all demo reports?')) { RptMock.reset(); location.search = '?id=1'; } };
    window.designer = RptDesigner.init({
      el: '#rpt-designer',
      reportId: id || null,
      ajax: RptMock.ajax,
      // demo: no render server, so "PDF" renders in the browser and opens the print dialog
      serverPdf: function (code) {
        return RptMock.payload(code).then(function (p) {
          return RptEngine.renderAsync(p.layout, p.data).then(function (res) { RptDesigner.printHtml(res); });
        });
      },
      onSaved: function (r) { if (!id) history.replaceState(null, '', '?id=' + r.id); }
    });
  })();
</script>
</body>
</html>
